name: Desplegar a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/online-store-nextjs-design-j1ou71
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Ajusta basePath automáticamente según la URL de Pages
      # (subruta /novastore en github.io, raíz con dominio propio).
      - uses: actions/configure-pages@v4
        with:
          static_site_generator: next

      - name: Compilar exportación estática
        run: npx next build

      - name: Evitar procesamiento Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
